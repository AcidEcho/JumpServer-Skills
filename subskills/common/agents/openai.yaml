interface:
  display_name: "JumpServer Common"
  short_description: "JumpServer V4.10 配置、预检、连通性、组织选择与端点验证子 Skill。"
  default_prompt: |
    使用 $jumpserver-common 处理 JumpServer V4.10 本地运行时配置、预检、连通性、组织选择和端点验证；Access、Query、Create、Update 的运行时状态未知时先使用本 Skill。
    本子 Skill 不处理业务查询或业务写入。
    从仓库根目录执行 `python3 subskills/common/scripts/jms_common.py ...`；若本目录被独立注册且 cwd 位于本目录，执行 `python3 scripts/jms_common.py ...`。
    配置未知时依次使用 `config-status --json`、必要的 `config-write --confirm`、`ping`。组织切换只有 `select-org --confirm` 可以写 `.env JMS_ORG_ID`。
    继续遵循仓库根级 `references/routing-and-safety.md`；完整仓库必须保留。
