interface:
  display_name: "JumpServer Skills"
  short_description: "JumpServer V4.10 主 Skill + 子 Skill。适用于资产/账号/用户/组织查询、权限查询、用户有效访问范围、登录/会话/命令/传输审计、治理巡检、访问分析、创建用户、创建用户组、创建组织、邀请用户加入组织、添加用户到用户组、创建标签、创建节点、创建主机资产、创建网络设备资产、创建数据库资产、创建 Web 资产、创建网域、创建网关机器、创建账号模板、给资产批量添加账号、给资产或节点批量添加账号模板、创建命令组、创建命令过滤规则、创建用户登录控制、创建连接方式过滤器、创建资产授权规则、创建资产连接规则、创建数据脱敏过滤规则，以及某天或某时间段的 JumpServer 使用报告；报告类请求必须优先走正式入口 `jms_report.py`。"
  default_prompt: |
    使用 $jumpserver-skills 处理 JumpServer V4.10 请求。
    全仓库路由、正式入口边界、允许写操作白名单和全局阻塞规则以 `references/routing-and-safety.md` 为准。
    正式入口返回的 JSON key 保持英文契约；对最终用户回显时，优先使用中文标签，必要时再在括号里补原字段名，例如 `生效组织（effective_org）：Default`。不要直接只把英文字段名当作用户可读标签。
    `python3 subskills/*/scripts/...` 这类正式入口路径默认以 skill 根目录为当前工作目录；若命令找不到脚本，先检查 cwd 是否在 skill 根目录，再决定是否改用仓库相对路径，不要直接把它归因为文档路径错误。
    如果用户点名一个或多个具体用户，并问某时间窗内“登录多少次 / 登录次数 / 成功登录多少次 / 失败登录多少次”，不要走 `daily-usage`、`recent-active-users-ranking` 或 Top 榜单；优先使用 `python3 subskills/query/scripts/jms_audit.py audit-list --audit-type login ...`。默认统计全部登录记录，只有用户明确要求成功/失败或给出页面 `status` 口径时，才分别传 `--status 1/0`。多个用户时逐个查询，并直接使用返回里的 `summary.total` 回答。解析结果时固定按 `ok -> result -> summary / records` 读取；不能对可见 `records` 人工计数，也不要写“从这次已返回记录看”“我逐条数出来的”这类样本口吻。若终端输出被截断或只看到部分 JSON 片段，不能据此估算总量。
    先判请求的核心对象是否为某一天或某一段时间内的 JumpServer 使用数据分析；这包括使用报告、日报、使用情况、使用分析、审计分析、某天发生了什么、分析 `20260310`、看某天登录/会话/命令情况、JumpServer 使用概览，以及“帮我分析下某天堡垒机器的使用情况”“帮我分析下某时间段的堡垒机器使用情况”“帮我分析下20260310的堡垒机使用情况”“帮我分析下3月10号的堡垒机器使用情况”“帮我分析下2026-03-10到2026-03-24的堡垒机使用情况”“帮我分析下上周的堡垒机使用情况”这类说法。
    如果是，必须优先使用 `python3 subskills/query/scripts/jms_report.py daily-usage ...`；由它加载 `template/bastion-daily-usage-template.html` 与 `subskills/query/references/metadata/daily_usage_report_template_fields.json`，并在输出前完成生成后自检。
    这类请求要先把“昨天 / 20260310 / 3月10号 / 上周 / 本月”等时间表达归一化为明确时间窗，再生成完整 HTML 报告；不要先输出自由文本摘要。摘要只能作为报告的简短补充。
    如果 `daily-usage` 成功返回，最终回答必须先明确说明“报告已生成”，再按顺序回显报告文件、文件大小、模板路径、字段元数据路径、报告日期/开始时间/结束时间、生效组织、可切换组织、已查询命令存储 ID/数量、校验摘要；必要时可在中文标签后补原字段名，如 `生效组织（effective_org）`、`校验摘要（validation_summary）`。不得后台已生成 HTML 却只对外给摘要。
    只有当用户明确说“不要生成报告，直接分析”“先简单说下”“只给我结论”“不用模板”时，才允许跳过模板直接给简短分析。即使跳过模板，只要问题里还有“近一个月 / 最近 30 天 / 上周 / 本月”这类相对时间词，也要先把它们固定成明确的 `date_from/date_to`，并在回答里回显最终时间窗；其中“近一个月”默认按 recent 30 days 解释，不按自然月处理，除非用户明确说“上个月”“3 月整月”。
    当前组织保存在 `.env JMS_ORG_ID`；普通正式入口未显式传组织时使用当前组织。报告类 `daily-usage` 未显式传组织时默认使用全局组织 `00000000-0000-0000-0000-000000000000`，不写 `.env JMS_ORG_ID`；如果报告显式传 `--org-id` 或唯一匹配的 `--org-name`，按该组织生成报告并写入 `.env JMS_ORG_ID`。普通查询类入口支持 `--org-id` / `--org-name` 单次命令覆盖组织，不写回 `.env`，可显式传全局组织 ID 解析全局用户。create 子 Skill 例外：创建用户/用户组可直接传 `--org-name <name> --confirm`，唯一匹配后写入 `.env JMS_ORG_ID` 并创建；未匹配或多匹配时返回 `candidate_orgs`，用户选准确组织名后重试。邀请用户加入组织走 `python3 subskills/create/scripts/jms_invite_user.py invite-user-to-org ... --confirm`，用户从全局组织解析，组织角色在目标组织解析，目标组织只限定本次命令，不写 `.env`。添加用户到用户组走 `python3 subskills/create/scripts/jms_add_user_to_group.py add-user-to-user-group ... --confirm`，用户和用户组都只在目标组织解析，目标组织只限定本次命令，不写 `.env`。创建标签走 `python3 subskills/create/scripts/jms_create_label.py create-label ... --confirm`，显式 `--org-id` / `--org-name` 只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；`name/value` 必填，`color/comment` 未传不发送。创建节点走 `python3 subskills/create/scripts/jms_create_node.py create-node ... --confirm`，POST `/api/v1/assets/nodes/`，payload 只发送 `org_id/full_value/value`；显式 `--org-id` / `--org-name` 复用组织解析，只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；无 `--confirm` 默认 dry-run，`--confirm` 才创建。创建主机/网络设备/数据库/Web 资产走 `python3 subskills/create/scripts/jms_create_asset.py create-host-asset ... --confirm`、`create-device-asset ... --confirm`、`create-database-asset ... --confirm` 或 `create-web-asset ... --confirm`，分别 POST `/api/v1/assets/hosts/`、`/api/v1/assets/devices/`、`/api/v1/assets/database/`、`/api/v1/assets/webs/`；`--confirm` 时解析 `platform/nodes/labels/zone/accounts[].template`；未传协议按平台默认协议补齐；密文字段脱敏；全局组织禁止。创建网域/网关机器走 `python3 subskills/create/scripts/jms_create_zone_gateway.py create-zone ... --confirm` 或 `create-gateway ... --confirm`，分别 POST `/api/v1/assets/zones/` 和 `/api/v1/assets/gateways/`；网关 `--confirm` 时解析 `platform/zone/nodes/labels` 并校验账号结构；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；无 `--confirm` 默认 dry-run，网关 dry-run 会脱敏 `accounts[].secret/passphrase`。创建账号模板走 `python3 subskills/create/scripts/jms_create_account_template.py create-account-template ... --confirm`，POST `/api/v1/accounts/account-templates/`；以完整 `--payload` JSON 为主，支持常用显式字段覆盖；`--confirm` 时解析 `su_from/platforms`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；无 `--confirm` 默认 dry-run，`--confirm` 才创建；dry-run 和回显必须脱敏 `secret`、`passphrase` 等密文字段。给资产批量添加账号走 `python3 subskills/create/scripts/jms_asset_account_bulk.py add-account-to-assets ... --confirm`，POST `/api/v1/accounts/accounts/bulk/`；以完整 `--payload` JSON 为主，支持常用显式字段覆盖；资产支持 ID、名称或地址；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；密文字段脱敏。给资产或节点批量添加账号模板走 `python3 subskills/create/scripts/jms_asset_account_bulk.py add-account-template-to-assets ... --confirm`，POST `/api/v1/accounts/accounts/bulk/`；以完整 `--payload` JSON 为主，支持常用显式字段覆盖；账号模板支持 ID 或名称，资产支持 ID、名称或地址，节点支持 ID、名称或 full_value；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止。创建命令组/命令过滤规则走 `python3 subskills/create/scripts/jms_create_command_acl.py create-command-group ... --confirm` 或 `create-command-filter-rule ... --confirm`，分别 POST `/api/v1/acls/command-groups/` 和 `/api/v1/acls/command-filter-acls/`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；无 `--confirm` 默认 dry-run；命令组只发送 `type/ignore_case/name/content/comment`，`name/type/content` 必填；命令过滤规则以完整 `--payload` JSON 为主，支持常用显式字段覆盖，本地校验 `accounts/users.attrs/assets.attrs`。创建用户登录控制走 `python3 subskills/create/scripts/jms_create_login_acl.py create-login-acl ... --confirm`，POST `/api/v1/acls/login-acls/`；只能在全局组织下创建，显式组织或 `.env JMS_ORG_ID` 最终都必须是全局组织 ID `00000000-0000-0000-0000-000000000000`；不写 `.env`；无 `--confirm` 默认 dry-run；以完整 `--payload` JSON 为主，常用显式字段 `--name`、`--priority`、`--action`、`--reviewer`、`--is-active`、`--comment` 可覆盖；本地校验 `rules/users.attrs`；`action` 只接受 `review`、`accept`、`reject`、`notice`，`review`/`notice` 需要 `reviewers`。创建连接方式过滤器走 `python3 subskills/create/scripts/jms_create_connect_method_acl.py create-connect-method-acl ... --confirm`，POST `/api/v1/acls/connect-method-acls/`；只能在全局组织下创建，显式组织或 `.env JMS_ORG_ID` 最终都必须是全局组织 ID `00000000-0000-0000-0000-000000000000`；不写 `.env`；无 `--confirm` 默认 dry-run；以完整 `--payload` JSON 为主，常用显式字段 `--name`、`--action`、`--connect-method`、`--is-active`、`--comment` 可覆盖；本地校验 `users.attrs`；`action` 只接受 `accept` 或 `reject`；`connect_methods` 不做硬编码枚举，`--confirm` 时查询连接方式选项接口并发送选项 `value` 字段，`label` 只作为显示名。创建组织走 `python3 subskills/create/scripts/jms_create_org.py create-organization ... --confirm`，请求不带 `X-JMS-ORG`，成功后不切换 `.env JMS_ORG_ID`。需要切换当前组织时，执行 `python3 subskills/common/scripts/jms_common.py select-org --org-id <org-id> --confirm` 或 `--org-name <org-name> --confirm`。
    创建资产授权规则走 `python3 subskills/create/scripts/jms_create_asset_permission.py create-asset-permission ... --confirm`，POST `/api/v1/perms/asset-permissions/`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；`assets/nodes/users/user_groups` 在 `--confirm` 时复用现有解析能力转成 UUID 或 `pk`；显式协议按 `label/value` 解析并发送 `value`；未传账号默认 `@ALL`，未传动作默认全部 value。创建资产连接规则走 `python3 subskills/create/scripts/jms_create_login_asset_acl.py create-login-asset-acl ... --confirm`，POST `/api/v1/acls/login-asset-acls/`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；`users.type=ids` 和 `assets.type=ids` 在 `--confirm` 时复用现有用户/资产解析能力转成 ID；本地校验 `accounts/rules/users.attrs/assets.attrs`。创建数据脱敏过滤规则走 `python3 subskills/create/scripts/jms_create_data_masking_rule.py create-data-masking-rule ... --confirm`，POST `/api/v1/acls/data-masking-rules/`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；`accounts` 只支持 `@ALL/@SPEC`；`users.type=ids` 和 `assets.type=ids` 在 `--confirm` 时复用现有用户/资产解析能力转成 ID；本地校验 `accounts/users.attrs/assets.attrs`。
    报告里的命令审计字段在未显式给 `command_storage_id` 时，默认按 `command_storage_scope=all` 汇总全部可访问 command storage；普通命令审计查询仍保留原来的默认 storage / 单 storage / 多 storage 阻塞逻辑。
    如果是配置、组织、连通性或端点验证，优先走 `python3 subskills/common/scripts/jms_common.py ...`。如果是对象解析，走 `python3 subskills/query/scripts/jms_query.py resolve ...`；如果是平台解析、设置、许可证、工单、存储、报表原始数据，走 `python3 subskills/query/scripts/jms_runtime_query.py ...`；如果是巡检、治理或 capability 聚合分析，走 `python3 subskills/query/scripts/jms_inspect.py inspect ...` 或 `python3 subskills/query/scripts/jms_audit.py audit-analyze ...`。
    如果用户是在问某某用户当前能访问哪些资产、节点，或在某资产下有哪些账号 / 协议，归为“用户有效访问范围”，优先走 `python3 subskills/query/scripts/jms_access.py user-assets ...` / `user-nodes ...` / `user-asset-access ...`。结果型问法优先返回 `asset_count` + `assets`、`node_count` + `nodes`、或 `permed_accounts` + `permed_protocols`，不要退回成授权规则说明；`user-assets` / `user-nodes` 的 effective access 结果是这类问题的唯一权威来源。
    用户明确说“在 Default 组织下”“在某组织下”时，视为显式组织，不是弱过滤提示；先解析组织 ID，再优先使用 `--org-id` 在单次命令内限定组织；不要回退成“检查所有组织”或“授权规则说明”。对中文姓名等显示名，允许先解析用户对象，再用 `user-id` 执行。
    如果用户是在问“资产授权给了谁 / 谁被授权到这台资产 / 这台资产有哪些授权用户”，优先先解析资产，再走 `python3 subskills/query/scripts/jms_permissions.py asset-perm-users --asset-id ...`；默认只回答授权主体，不把超级管理员混进来。若 `asset-perm-users` 为空，再用 `python3 subskills/query/scripts/jms_permissions.py asset-permission-explain ...` 核对是否存在节点/标签/直接资产规则命中，并明确区分“授权主体为空”与“规则解释命中但服务端授权用户视图为空”。
    如果用户明确在问“为什么能访问 / 依据是什么 / 授权规则 / 权限详情 / 节点授权是否覆盖某资产”，进入权限关系或访问分析，走 `python3 subskills/query/scripts/jms_permissions.py asset-permission-explain ...`、`python3 subskills/query/scripts/jms_permissions.py permission-list ...` / `permission-get ...`；如果是登录、会话、命令、传输和行为审计，走 `python3 subskills/query/scripts/jms_audit.py audit-analyze ...` 或相关审计子命令；如果是对象查询，走 `python3 subskills/query/scripts/jms_query.py object-list ...` / `object-get ...`。
    遇到“某用户某天连接过哪些机器 / 某天会话数 / 某天连了几次”，先解析用户，再优先执行 `python3 subskills/query/scripts/jms_audit.py audit-analyze --capability session-record-query --filters ...`；若要传解析后的用户 UUID，固定写到 `filters.user_id`，不要把 UUID 塞进 `filters.user`；不要先用 `audit-list --audit-type session` 下结论。
    先做 `config-status --json` 和 `ping` 预检；普通查询优先只选 1 个正式入口，报告请求的完成标准是“生成并验证通过的 HTML 报告”；如果多组织且未选择当前组织，按返回的 `candidate_orgs` 先执行 `select-org --confirm`；如果当前组织之外还有其他可访问组织，继续回显可切换组织（`switchable_orgs`）。
    只使用正式 CLI 入口，不生成临时 SDK/HTTP 脚本，不现场写临时报告拼装逻辑，不猜对象 ID、组织或鉴权信息。业务写操作仅允许 `python3 subskills/create/scripts/jms_create_user.py create-user ... --confirm`、`python3 subskills/create/scripts/jms_create_user_group.py create-user-group ... --confirm`、`python3 subskills/create/scripts/jms_create_org.py create-organization ... --confirm`、`python3 subskills/create/scripts/jms_invite_user.py invite-user-to-org ... --confirm`、`python3 subskills/create/scripts/jms_add_user_to_group.py add-user-to-user-group ... --confirm`、`python3 subskills/create/scripts/jms_create_label.py create-label ... --confirm`、`python3 subskills/create/scripts/jms_create_node.py create-node ... --confirm`、`python3 subskills/create/scripts/jms_create_asset.py create-host-asset ... --confirm`、`python3 subskills/create/scripts/jms_create_asset.py create-device-asset ... --confirm`、`python3 subskills/create/scripts/jms_create_asset.py create-database-asset ... --confirm`、`python3 subskills/create/scripts/jms_create_asset.py create-web-asset ... --confirm`、`python3 subskills/create/scripts/jms_create_zone_gateway.py create-zone ... --confirm`、`python3 subskills/create/scripts/jms_create_zone_gateway.py create-gateway ... --confirm`、`python3 subskills/create/scripts/jms_create_account_template.py create-account-template ... --confirm`、`python3 subskills/create/scripts/jms_asset_account_bulk.py add-account-to-assets ... --confirm`、`python3 subskills/create/scripts/jms_asset_account_bulk.py add-account-template-to-assets ... --confirm`、`python3 subskills/create/scripts/jms_create_command_acl.py create-command-group ... --confirm`、`python3 subskills/create/scripts/jms_create_command_acl.py create-command-filter-rule ... --confirm`、`python3 subskills/create/scripts/jms_create_login_acl.py create-login-acl ... --confirm`、`python3 subskills/create/scripts/jms_create_connect_method_acl.py create-connect-method-acl ... --confirm`、`python3 subskills/create/scripts/jms_create_asset_permission.py create-asset-permission ... --confirm`、`python3 subskills/create/scripts/jms_create_login_asset_acl.py create-login-asset-acl ... --confirm` 和 `python3 subskills/create/scripts/jms_create_data_masking_rule.py create-data-masking-rule ... --confirm`；其他写操作阻塞。创建用户组添加成员时，`--user` 只传用户 ID；如果用户给的是姓名、username 或 email，先用 `python3 subskills/query/scripts/jms_query.py resolve --resource user --name <value>` 解析。邀请用户加入组织时，`--user` 可传 username、email、姓名或 UUID，由邀请脚本从全局组织解析。添加用户到用户组时，`--user` 可传 username、email、姓名或 UUID，但只在目标组织解析。创建标签无 `--confirm` 只 dry-run；有 `--confirm` 才查重并 POST 到 `/api/v1/labels/labels/`。创建节点无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/assets/nodes/`。创建主机/网络设备/数据库/Web 资产无 `--confirm` 默认 dry-run；有 `--confirm` 才解析引用、查重并 POST 到对应资产接口。创建网域/网关机器无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/assets/zones/` 或 `/api/v1/assets/gateways/`。创建账号模板无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/accounts/account-templates/`；显式组织只限定本次命令，不写 `.env`；未传组织使用 `.env JMS_ORG_ID`；全局组织禁止；密文字段脱敏。给资产批量添加账号无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/accounts/accounts/bulk/`；密文字段脱敏。给资产或节点批量添加账号模板无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/accounts/accounts/bulk/`。创建命令组/命令过滤规则无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/acls/command-groups/` 或 `/api/v1/acls/command-filter-acls/`。创建用户登录控制无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/acls/login-acls/`。创建连接方式过滤器无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/acls/connect-method-acls/`。创建资产授权规则无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/perms/asset-permissions/`。创建资产连接规则无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/acls/login-asset-acls/`。创建数据脱敏过滤规则无 `--confirm` 默认 dry-run；有 `--confirm` 才 POST 到 `/api/v1/acls/data-masking-rules/`。
    只有正式入口在精确时间窗和正确组织下实际返回 0 条时，才能说“没有记录”；未经验证不要猜页面选错日期、时区差异、数据同步延迟等原因。若页面总数与用户过滤结果不同，要明确区分“当天总会话数”和“该用户会话数”的口径差异。
