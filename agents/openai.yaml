interface:
  display_name: "JumpServer Skills"
  short_description: "JumpServer V4.10 主 Skill + 子 Skill。覆盖资产/账号/用户/组织查询、权限查询、用户有效访问范围、登录/会话/命令/传输审计、治理巡检、访问分析、23 个 create 写操作（用户/用户组/组织/邀请/标签/节点/资产/网域/网关/账号模板/账号绑定/各类 ACL/资产授权/数据脱敏规则），以及某天或某时间段的 JumpServer 使用报告。详细写操作白名单与组织限制以 `references/routing-and-safety.md` 为准；report 类请求必须经由 `jms_report.py daily-usage`。"
  default_prompt: |
    使用 $jumpserver-skills 处理 JumpServer V4.10 请求。

    ## 单一信息来源
    - 路由优先级、写操作白名单、组织限制、密文脱敏要求：以 `references/routing-and-safety.md` 为唯一来源。
    - 每条 create 命令的字段、payload 和示例：以 `subskills/create/references/index.md` 及其子文档为准。
    - 查询/巡检/审计 capability 详情：以 `subskills/query/references/` 下的文档为准。
    - 本 prompt 只保留路由优先级、阻塞红线、统计口径与执行习惯。

    ## 路由优先级（高 -> 低）
    1. 报告 / 使用分析（核心对象是某天 / 某时间段的整体使用数据）-> `jms_report.py daily-usage`。
    2. 配置 / 组织 / 连通性 / 解析 -> `jms_common.py`、`jms_query.py resolve`、`jms_runtime_query.py`。
    3. 用户有效访问范围（"X 用户能访问哪些资产 / 节点 / 账号"）-> `jms_access.py user-assets / user-nodes / user-asset-access`。
    4. 权限关系（"为什么能访问 / 授权规则详情 / 节点授权覆盖 / 资产授权给了谁"）-> `jms_permissions.py`。
    5. 审计调查（明确日期或时间段下的登录 / 会话 / 命令 / 传输明细）-> `jms_audit.py`。
    6. 对象查询（按名称、地址、节点、平台、启用状态等读取对象）-> `jms_query.py object-list / object-get`。
    7. 治理 / 聚合分析（capability 化的统计、排行、巡检）-> `jms_inspect.py inspect` 或 `jms_audit.py audit-analyze`。

    ## 报告 / 使用分析的强约束
    - 触发条件：核心是某天或某时间段的整体使用情况、日报/周报/月报、使用统计/概览、"某天发生了什么"，或 "帮我分析下某天堡垒机器的使用情况"、"帮我分析下20260310的堡垒机使用情况" 这类说法（含具体日期或相对日期）。
    - 必须先把 `昨天 / 20260310 / 3 月 10 号 / 上周 / 本月` 等表达归一化为明确时间窗，再调用 `jms_report.py daily-usage`；不要先输出自由文本摘要。
    - 报告生成成功后，必须先回显"报告已生成"，然后顺序回显：报告文件路径、文件大小、模板路径、字段元数据路径、报告日期 / 开始时间 / 结束时间、生效组织、可切换组织、已查询命令存储 ID / 数量、`validation_summary`；中文标签后可以括号补原字段名，例如 `生效组织（effective_org）`、`校验摘要（validation_summary）`。
    - 未显式传组织时 `daily-usage` 默认全局组织 `00000000-0000-0000-0000-000000000000` 且不写 `.env`；显式传 `--org-id` 或唯一匹配 `--org-name` 时按该组织生成并写 `.env JMS_ORG_ID`。
    - 跳过模板报告的前提：用户明确说"不要生成报告，直接分析 / 先简单说下 / 只给我结论 / 不用模板"。跳过时仍要把相对时间词固定为明确 `date_from / date_to`；"近一个月" 默认按 recent 30 days，不按自然月，除非用户明确说"上个月 / 3 月整月"。

    ## 登录次数 / 审计调查的路由要点
    - 用户问命名用户在某时间窗 "登录多少次 / 成功 / 失败"，必须走 `jms_audit.py audit-list --audit-type login`；不要走 `daily-usage`、`recent-active-users-ranking` 或 Top 榜单。默认统计全部登录记录；仅当用户明确给 status 口径时才分别传 `--status 1/0`。
    - 多用户时逐个查询，直接使用返回里的 `summary.total` 回答。
    - 解析结果固定按 `ok -> result -> summary / records` 读取；不要对可见 `records` 人工计数，不要写“从这次已返回记录看”“我逐条数出来的”这类样本口吻；终端截断或只见部分 JSON 不能据此估算总量。
    - 用户某天连接过哪些机器 / 某天会话数：先解析用户，再 `jms_audit.py audit-analyze --capability session-record-query --filters ...`；用户 UUID 写入 `filters.user_id`，不要塞进 `filters.user`；不要先用 `audit-list --audit-type session` 下结论。

    ## 用户有效访问范围 vs 权限关系（边界）
    - "某用户能访问哪些资产 / 节点 / 账号 / 协议"（结果型）-> `jms_access.py user-assets / user-nodes / user-asset-access`；优先返回 `asset_count + assets`、`node_count + nodes`、`permed_accounts + permed_protocols`，不要退回授权规则说明。
    - "在 Default 组织下 / 在某组织下" 是显式组织，不是弱过滤提示；先解析组织 ID，再 `--org-id` 单次命令限定，不要回退成"全组织检查"。中文姓名等显示名先解析用户再用 `user-id` 执行。
    - "为什么能访问 / 依据是什么 / 授权规则 / 权限详情 / 节点授权是否覆盖某资产" -> `jms_permissions.py asset-permission-explain`、`permission-list`、`permission-get`。
    - "资产授权给了谁 / 谁被授权到这台资产" -> 先解析资产，再 `jms_permissions.py asset-perm-users --asset-id ...`；默认只回答授权主体，不混入超级管理员。`asset-perm-users` 为空时再用 `asset-permission-explain` 区分"授权主体为空"与"规则解释命中但服务端授权用户视图为空"。

    ## Create 写操作通用规则
    - 写操作仅限 `references/routing-and-safety.md` 的"允许写操作"白名单里 23 条；其他写操作一律阻塞。
    - 所有 create 命令默认 dry-run；必须显式追加 `--confirm` 才查重、解析引用并 POST。
    - 组织规则、`--org-id / --org-name` 是否写 `.env`、是否禁止全局组织、是否要求全局组织：以 `references/routing-and-safety.md` 与各 `subskills/create/references/<command>.md` 为准；本 prompt 不再逐命令重复。
    - dry-run 与回显必须脱敏：`secret`、`passphrase`、`private_key`、`access_key`、`api_key`、`token`、`password`。
    - 创建用户组添加成员只接受用户 ID；如果用户给的是姓名/username/email，先 `jms_query.py resolve --resource user --name <value>` 解析。
    - 邀请用户加入组织时 `--user` 可以传 username / email / 姓名 / UUID，脚本会在全局组织解析。
    - 添加用户到用户组时 `--user` 与 `--user-group` 都只在目标组织解析。
    - 切换当前组织：`jms_common.py select-org --org-id <org-id> --confirm` 或 `--org-name <name> --confirm`。

    ## 输出与回显
    - 正式入口返回的 JSON key 保持英文契约；对最终用户回显时优先用中文标签，必要时括号补原字段名，例如 `生效组织（effective_org）：Default`。不要把英文字段名直接当用户可读标签。
    - 多组织且未选择当前组织时，按返回里的 `candidate_orgs` 提示 `select-org --confirm`；当前组织之外还有其他可访问组织时，继续回显 `switchable_orgs`。
    - 只有正式入口在精确时间窗与正确组织下确实返回 0 条时，才能说"没有记录"；未经验证不要猜页面选错日期、时区差异、数据同步延迟等原因。页面总数 vs 用户过滤结果差异要明确区分口径（如"当天总会话数" vs "该用户会话数"）。

    ## 执行习惯
    - `python3 subskills/*/scripts/...` 路径默认以 skill 根目录为 cwd；命令找不到脚本时先检查 cwd，不要把这归因为文档路径错误。
    - 普通查询优先只选一个正式入口；报告请求的完成标准是"生成并验证通过的 HTML 报告"。
    - 先做 `config-status --json` 与 `ping` 预检；不确定时调用 `jms_common.py select-org / endpoint-verify`。
    - 只使用正式 CLI 入口，不生成临时 SDK / HTTP 脚本，不现场拼临时报告逻辑，不猜对象 ID / 组织 / 鉴权信息。
